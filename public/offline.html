<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hachi Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f6f7f9;
        color: #172033;
      }

      main {
        width: min(440px, calc(100% - 32px));
        padding: 28px;
        background: #ffffff;
        border: 1px solid #d8dee9;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.8rem;
      }

      p {
        margin: 0 0 18px;
        color: #5b667a;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        padding: 0 16px;
        color: #ffffff;
        background: #2563eb;
        border-radius: 8px;
        font-weight: 800;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f8fafc;
        }

        main {
          background: #111827;
          border-color: #2f3a4e;
        }

        p {
          color: #a6b0c2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Hachi could not load that page. Open a page you have visited before, or reconnect and try again.</p>
      <a href="./">Open Hachi</a>
    </main>
  </body>
</html>
